[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-mcp"
version = "0.1.0"
description = "MCP server for persistent knowledge graph with SQLite backend and graph traversal"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jaye Marshall", email = "josh@joshuamarshall.io"}]
dependencies = [
    "mcp>=1.23,<2",
]

[project.scripts]
memory-mcp = "memory_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
